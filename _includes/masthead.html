{% include base_path %}

<div class="masthead">
  <div class="masthead__inner-wrap">
    <nav id="main-nav" class="site-nav" aria-label="Main">
      <a class="site-nav__brand" href="{{ base_path }}/">{{ site.title }}</a>

      <ul class="site-nav__links" id="site-nav-links">
        {% for link in site.data.navigation.main %}
          {% if link.url contains 'http' %}
            {% assign domain = '' %}
          {% else %}
            {% assign domain = base_path %}
          {% endif %}
          <li><a href="{{ domain }}{{ link.url }}">{{ link.title }}</a></li>
        {% endfor %}
      </ul>

      <ul class="site-nav__actions">
        <li>
          <button type="button" id="theme-toggle" class="site-nav__theme" aria-label="Toggle theme">
            <i id="theme-icon" class="fa-solid fa-sun" aria-hidden="true"></i>
          </button>
        </li>
        <li>
          <button type="button" class="site-nav__toggle" aria-expanded="false" aria-controls="site-nav-links" aria-label="Menu">
            <span class="site-nav__bars" aria-hidden="true"></span>
          </button>
        </li>
      </ul>
    </nav>
  </div>
</div>

<script>
  /* Mobile menu: the toggle opens and closes the link list; Escape closes it */
  (function () {
    var nav = document.getElementById("main-nav");
    var toggle = nav.querySelector(".site-nav__toggle");

    function setOpen(open) {
      nav.classList.toggle("is-open", open);
      toggle.setAttribute("aria-expanded", open ? "true" : "false");
    }

    toggle.addEventListener("click", function () {
      setOpen(!nav.classList.contains("is-open"));
    });

    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") setOpen(false);
    });
  })();
</script>
